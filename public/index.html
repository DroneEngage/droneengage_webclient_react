<!DOCTYPE html>
<html>
  <head>
    <meta
    name="DroneEngage WebClient"
    content="This is the GCS station for DroneEngage and Andruav."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1">


  </head>
  <body>

    <div id="root">
      <!-- Initial loading placeholder. React replaces this when it mounts,
           so the user sees a spinner during config fetch + bundle parse
           instead of a blank screen. Keep styles inline so it does not
           depend on any CSS bundle being loaded yet. -->
      <div id="initial-loader" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#222;color:#cfd8e3;font-family:system-ui,Segoe UI,Roboto,sans-serif;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:4px solid rgba(255,255,255,0.2);border-top-color:#4db8ff;border-radius:50%;margin:0 auto 12px;animation:de-spin 0.9s linear infinite;"></div>
          <div style="font-size:14px;letter-spacing:0.04em;">DroneEngage WebClient</div>
        </div>
      </div>
      <style>@keyframes de-spin{to{transform:rotate(360deg)}}</style>
    </div>

   
  </body>
</html>
